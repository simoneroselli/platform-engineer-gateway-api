name: CI Quality Checks

on:
  push:
    branches: [ "main" ]

jobs:
  lint-python:
    name: Lint Python Operator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort
          if [ -f operators/wordsmith-ops/requirements.txt ]; then
            pip install -r platform-workloads/operators/wordsmith-ops/requirements.txt
          fi

      - name: Check Code Formatting (Black & Isort)
        run: |
          black --check platform-workloads/operators/
          isort --check-profile black platform-workloads/operators/

      - name: Lint with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 platform-workloads/operators/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings for style checks (optional, adjust as needed)
          flake8 platform-workloads/operators/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  lint-kubernetes:
    name: Lint Kubernetes & Helm Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Lint Helm Chart
        run: |
          # Check the Helm chart under platform-workloads/charts/wordsmith
          helm lint platform-workloads/charts/wordsmith

      - name: Install Conftest / Actionlint (Optional YAML & Policy Linters)
        uses: instrumenta/conftest-action@master
        with:
          files: platform-workloads/
