apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-workloads-set
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: dev
            namespace: wordsmith-dev-app
            valuesFile: platform-workloads/environments/dev-values.yaml
          - env: prod
            namespace: wordsmith-prod-app
            valuesFile: platform-workloads/environments/prod-values.yaml
  template:
    metadata:
      name: 'wordsmith-{{env}}-app'
    spec:
      project: default
      source:
        repoURL: 'https://github.com/simoneroselli/platform-engineer-gateway-api.git'
        targetRevision: HEAD
        path: platform-workloads/charts/wordsmith
        helm:
          valueFiles:
            - ../../{{valuesFile}}
      destination:
        server: https://kubernetes.default.svc
        namespace: wordsmith-{{env}}-app
      syncPolicy:
        automated:
          prune: true
          selfHeal: true