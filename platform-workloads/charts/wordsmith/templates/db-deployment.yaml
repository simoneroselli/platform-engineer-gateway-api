apiVersion: apps/v1
kind: Deployment
metadata:
  name: '{{ .Values.appFullname }}-db'
  namespace: '{{ .Values.appFullname }}'
spec:
  replicas: {{ .Values.wordsmith.db.replicaCount }}
  selector:
    matchLabels:
      app: '{{ .Values.appFullname }}-db'
  template:
    metadata:
      labels:
        app: '{{ .Values.appFullname }}-db'
    spec:
      containers:
      - name: db
        image: '{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}'
        ports:
        - containerPort: 5432