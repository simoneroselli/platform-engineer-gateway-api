apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wordsmith-route
  namespace: '{{ .Values.appFullname }}'
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: '{{ .Values.gatewayFullname }}'
    namespace: '{{ .Values.gatewayNamespace }}'
  hostnames:
  - "wordsmith.local"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: '{{ .Values.appFullname }}-web'
      port: 80
      weight: 100