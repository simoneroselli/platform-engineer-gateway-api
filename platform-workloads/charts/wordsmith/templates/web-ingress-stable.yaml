apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordsmith-ingress-stable
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - host: {{ .Values.ingress.stable.host }}
    http:
      paths:
      - path: {{ .Values.ingress.stable.path }}
        pathType: Prefix
        backend:
          service:
            name: wordsmith-web-stable
            port:
              number: 80