apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-controller
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: v28.0.0
    helm:
      values: |
        providers:
          kubernetesGateway:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: wordsmith-gateway
  namespace: traefik-system # or your application namespace depending on your RBAC setup
spec:
  gatewayClassName: traefik # Refers to the Traefik GatewayClass installed in your cluster
  listeners:
  - name: web
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All