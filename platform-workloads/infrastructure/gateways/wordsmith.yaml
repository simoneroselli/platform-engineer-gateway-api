apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: wordsmith-gateway
  namespace: traefik-system
  annotations:  
    argocd.argoproj.io/sync-wave: "2"
spec:
  gatewayClassName: traefik
  listeners:
  - name: web
    protocol: HTTP
    port: 9080
    allowedRoutes:
      namespaces:
        from: All