apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: wordsmith-gateway
  namespace: traefik-system
  annotations:  
    argocd.argoproj.io/sync-wave: "2"
spec:
  gatewayClassName: traefik
  listeners:
  - name: web
    protocol: HTTP
    ports:
      web:
        port: 80
        expose:
          default: true
    entryPoints:
      web:
        address: ":80"